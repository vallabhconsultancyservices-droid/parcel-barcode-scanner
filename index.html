
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoice OCR Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f5f9;margin:0;padding:16px;color:#202938}
.container{max-width:560px;margin:auto;background:white;padding:20px;border-radius:14px;box-shadow:0 3px 15px #0001}
h2{text-align:center}
label{display:block;font-weight:bold;margin:14px 0 7px}
input,select{width:100%;padding:13px;border:1px solid #ccd2dc;border-radius:8px;font-size:16px}
button{width:100%;padding:14px;margin-top:14px;border:0;border-radius:8px;background:#155eef;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55}
#saveBtn{background:#138a4b}
#preview{width:100%;display:none;margin-top:12px;border-radius:8px}
#review{display:none;margin-top:20px}
#status{text-align:center;font-weight:bold;margin-top:15px;overflow-wrap:anywhere}
.note{font-size:13px;color:#667085;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h2>Invoice OCR Scanner</h2>
<p class="note">Select marketplace, scan invoice, check all six details and save.</p>

<label>1. Select Marketplace</label>
<select id="marketplace">
<option>Amazon</option>
<option>Meesho</option>
<option>Flipkart</option>
</select>

<label>2. Capture Invoice Photo</label>
<input id="camera" type="file" accept="image/*" capture="environment">
<img id="preview" alt="Invoice preview">

<button id="scanBtn" onclick="scanInvoice()">Scan Invoice / Read OCR</button>
<div id="status"></div>

<div id="review">
<h3>3. Review / Edit Details</h3>

<label>Invoice Date</label>
<input id="invoiceDate" placeholder="DD-MM-YYYY">

<label>Invoice Number</label>
<input id="invoiceNumber" placeholder="Invoice Number">

<label>Product Name</label>
<input id="productName" placeholder="Product Name">

<label>Order ID</label>
<input id="orderId" placeholder="Order ID">

<label>Total Amount (₹)</label>
<input id="totalAmount" inputmode="decimal" placeholder="Final Invoice Total">

<label>Quantity</label>
<input id="quantity" type="number" min="1" placeholder="Quantity">

<button id="saveBtn" onclick="saveInvoice()">4. Save to Google Sheet</button>
</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzGasdR-hlOOePT80lu9rZ0sz6xR3dBQ5qOUjwOA7XLlrmOuxDzOXGt8r172_CKaYIYSg/exec";

let selectedFile = null;

const camera = document.getElementById("camera");
const preview = document.getElementById("preview");
const statusBox = document.getElementById("status");

camera.addEventListener("change", function(){
  selectedFile = this.files[0] || null;
  document.getElementById("review").style.display = "none";

  if(selectedFile){
    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display = "block";
    statusBox.textContent = "Invoice photo ready.";
  }
});

function normalizeText(text){
  return text
    .replace(/\r/g,"\n")
    .replace(/[₹]/g," Rs. ")
    .replace(/[ \t]+/g," ")
    .replace(/\n{2,}/g,"\n")
    .trim();
}

function findDate(text){
  const patterns = [
    /Invoice\s*Date\s*[:\-]?\s*(\d{1,2}[./-]\d{1,2}[./-]\d{2,4})/i,
    /Invoice\s*Date\s*[:\-]?\s*(\d{1,2}\s+[A-Za-z]{3,9}\s+\d{4})/i
  ];
  for(const re of patterns){
    const m = text.match(re);
    if(m) return m[1].replace(/[./]/g,"-");
  }
  return "";
}

function findInvoiceNumber(text, marketplace){
  let m;
  if(marketplace === "Amazon"){
    m = text.match(/Invoice\s*Number\s*:\s*([A-Z0-9-]+)/i);
  } else if(marketplace === "Meesho"){
    m = text.match(/Invoice\s*No\.?\s*[:\-]?\s*([A-Z0-9-]+)/i);
  } else {
    m = text.match(/Invoice\s*No\.?\s*[:\-]?\s*([A-Z0-9-]+)/i);
  }
  return m ? m[1] : "";
}

function findOrderId(text, marketplace){
  let m;
  if(marketplace === "Amazon"){
    m = text.match(/Order\s*Number\s*:\s*([0-9]{3}-[0-9]{7}-[0-9]{7})/i);
  } else if(marketplace === "Meesho"){
    m = text.match(/Purchase\s*Order\s*No\.?\s*[:\-]?\s*([0-9]{10,}(?:_[0-9]+)?)/i);
    if(!m) m = text.match(/Order\s*No\.?\s*[:\-]?\s*([0-9]{10,}(?:_[0-9]+)?)/i);
    if(m) m[1] = m[1].replace(/_[0-9]+$/,"");
  } else {
    m = text.match(/Order\s*Id\s*[:\-]?\s*(OD[0-9]+)/i);
  }
  return m ? m[1] : "";
}

function findTotalAmount(text, marketplace){
  const lines = text.split("\n").map(x => x.trim()).filter(Boolean);

  // Prefer the final total row, never the tax-only row.
  const patterns = marketplace === "Flipkart"
    ? [/TOTAL\s*PRICE/i, /^TOTAL\b/i]
    : marketplace === "Amazon"
      ? [/^TOTAL\s*:/i, /^TOTAL\b/i]
      : [/^TOTAL\b/i, /^GRAND\s*TOTAL\b/i];

  for(const pattern of patterns){
    for(let i = lines.length - 1; i >= 0; i--){
      if(pattern.test(lines[i])){
        const amounts = lines[i].match(/(?:Rs\.?\s*)?([0-9,]+\.\d{2})/gi);
        if(amounts && amounts.length){
          const last = amounts[amounts.length - 1].match(/[0-9,]+\.\d{2}/);
          if(last) return last[0].replace(/,/g,"");
        }
      }
    }
  }

  // Fallback for wrapped total rows.
  const totalIndex = lines.findIndex(line =>
    /TOTAL\s*PRICE|^TOTAL\s*:/i.test(line)
  );
  if(totalIndex >= 0){
    const area = lines.slice(totalIndex, totalIndex + 3).join(" ");
    const amounts = area.match(/[0-9,]+\.\d{2}/g);
    if(amounts && amounts.length) return amounts[amounts.length - 1].replace(/,/g,"");
  }
  return "";
}

function findQuantity(text, marketplace){
  let m;

  if(marketplace === "Flipkart"){
    m = text.match(/TOTAL\s*QTY\s*:\s*(\d+)/i);
    if(m) return m[1];
  }

  // Amazon and Meesho: find Qty column near the product/HSN table.
  const lines = text.split("\n").map(x => x.trim()).filter(Boolean);
  for(let i = 0; i < lines.length; i++){
    if(/HSN\s*:/i.test(lines[i]) || /HSN\s+\d/i.test(lines[i])){
      const area = lines.slice(Math.max(0,i-3), i+2).join(" ");
      const qtyMatch = area.match(/\bQty\s*[:\-]?\s*(\d+)\b/i);
      if(qtyMatch) return qtyMatch[1];
    }
  }

  m = text.match(/TOTAL\s*QTY\s*:\s*(\d+)/i);
  return m ? m[1] : "";
}

function findProduct(text, marketplace){
  const lines = text.split("\n").map(x => x.trim()).filter(Boolean);

  if(marketplace === "Flipkart"){
    const start = lines.findIndex(x => /Product\s+Description\s+Qty/i.test(x));
    if(start >= 0){
      for(let i=start+1; i<Math.min(lines.length,start+8); i++){
        if(/HSN\s*:/i.test(lines[i])) break;
        if(lines[i].length > 12 && !/^(TOTAL|Gross|Taxable)/i.test(lines[i])){
          return lines[i].replace(/\s+/g," ").slice(0,250);
        }
      }
    }
  }

  if(marketplace === "Amazon"){
    const start = lines.findIndex(x => /Description\s+Unit/i.test(x));
    if(start >= 0){
      for(let i=start+1; i<Math.min(lines.length,start+12); i++){
        if(/HSN\s*:/i.test(lines[i])) break;
        if(lines[i].length > 12 && !/^(TOTAL|Amount in Words)/i.test(lines[i])){
          return lines[i].replace(/\s+/g," ").slice(0,250);
        }
      }
    }
  }

  if(marketplace === "Meesho"){
    const hsnIndex = lines.findIndex(x => /^HSN\b/i.test(x) || /\bHSN\s+\d/i.test(x));
    if(hsnIndex >= 0){
      for(let i=hsnIndex-1; i>=Math.max(0,hsnIndex-5); i--){
        if(lines[i].length > 12 && !/^(Total|Description|Product Details)/i.test(lines[i])){
          return lines[i].replace(/\s+/g," ").slice(0,250);
        }
      }
    }
  }

  return "";
}

async function scanInvoice(){
  if(!selectedFile){
    alert("Please capture an invoice photo first.");
    return;
  }

  const button = document.getElementById("scanBtn");
  button.disabled = true;
  statusBox.textContent = "OCR processing...";

  try{
    const result = await Tesseract.recognize(selectedFile,"eng",{
      logger: info => {
        if(info.status === "recognizing text"){
          statusBox.textContent = "OCR: " + Math.round(info.progress*100) + "%";
        }
      }
    });

    const text = normalizeText(result.data.text);
    const marketplace = document.getElementById("marketplace").value;

    document.getElementById("invoiceDate").value = findDate(text);
    document.getElementById("invoiceNumber").value = findInvoiceNumber(text,marketplace);
    document.getElementById("productName").value = findProduct(text,marketplace);
    document.getElementById("orderId").value = findOrderId(text,marketplace);
    document.getElementById("totalAmount").value = findTotalAmount(text,marketplace);
    document.getElementById("quantity").value = findQuantity(text,marketplace);

    document.getElementById("review").style.display = "block";
    statusBox.textContent = "OCR completed. Check and correct all six fields before saving.";

  }catch(error){
    console.error(error);
    statusBox.textContent = "OCR failed. Try a clearer invoice photo.";
  }finally{
    button.disabled = false;
  }
}

function saveInvoice(){
  const data = {
    action:"saveInvoice",
    marketplace:document.getElementById("marketplace").value,
    invoiceDate:document.getElementById("invoiceDate").value.trim(),
    invoiceNumber:document.getElementById("invoiceNumber").value.trim(),
    productName:document.getElementById("productName").value.trim(),
    orderId:document.getElementById("orderId").value.trim(),
    totalAmount:document.getElementById("totalAmount").value.trim(),
    quantity:document.getElementById("quantity").value.trim()
  };

  if(Object.values(data).some(v => !String(v).trim())){
    alert("Please fill all six invoice details.");
    return;
  }

  const button = document.getElementById("saveBtn");
  button.disabled = true;
  statusBox.textContent = "Saving invoice...";

  const callbackName = "invoiceCallback_" + Date.now();

  window[callbackName] = function(response){
    delete window[callbackName];
    if(script.parentNode) script.parentNode.removeChild(script);
    button.disabled = false;

    if(response.success){
      statusBox.textContent = "Invoice saved successfully to Google Sheet.";
      document.getElementById("review").style.display = "none";
      camera.value = "";
      selectedFile = null;
      preview.style.display = "none";
    }else{
      statusBox.textContent = response.message || "Save failed.";
      if(response.duplicate) alert(response.message);
    }
  };

  const params = new URLSearchParams({...data,callback:callbackName});
  const script = document.createElement("script");
  script.src = API_URL + "?" + params.toString();

  script.onerror = function(){
    delete window[callbackName];
    button.disabled = false;
    statusBox.textContent = "Connection failed. Check Apps Script deployment.";
  };

  document.body.appendChild(script);
}
</script>
</body>
</html>
