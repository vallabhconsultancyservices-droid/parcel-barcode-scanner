<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoice OCR Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 20px auto; padding: 16px; }
    h2 { margin-bottom: 8px; }
    label { display:block; margin-top:12px; font-weight:bold; }
    input, select, button { box-sizing:border-box; width:100%; padding:11px; margin-top:5px; font-size:16px; }
    button { cursor:pointer; margin-top:14px; }
    #status { margin:12px 0; white-space:pre-wrap; }
    .hint { color:#555; font-size:13px; }
  </style>
</head>
<body>
  <h2>Invoice OCR Scanner</h2>
  <p class="hint">Invoice photo/PDFમાંથી details વાંચો, ચકાસો અને પછી Google Sheetમાં save કરો.</p>

  <label>Marketplace</label>
  <select id="marketplace">
    <option value="Meesho">Meesho</option>
    <option value="Amazon">Amazon</option>
    <option value="Flipkart">Flipkart</option>
  </select>

  <label>Invoice Photo</label>
  <input id="invoiceFile" type="file" accept="image/*,.pdf" />

  <button id="scanBtn" type="button">Scan Invoice</button>
  <div id="status"></div>

  <div id="review" hidden>
    <label id="field1Label"></label>
    <input id="field1" />

    <label id="field2Label"></label>
    <textarea id="field2" rows="3" style="width:100%;padding:11px;box-sizing:border-box"></textarea>

    <label id="field3Label"></label>
    <input id="field3" />

    <label id="field4Label"></label>
    <input id="field4" />

    <button id="saveBtn" type="button">Confirm & Save to Google Sheet</button>
  </div>

<script>
const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbzGasdR-hlOOePT80lu9rZ0sz6xR3dBQ5qOUjwOA7XLlrmOuxDzOXGt8r172_CKaYIYSg/exec";

const $ = id => document.getElementById(id);

const FIELD_LABELS = {
  Meesho: ["Order No.", "Description", "Total", "Invoice No."],
  Amazon: ["Order Number", "Invoice Number", "Description", "Total Amount"],
  Flipkart: ["Product", "Total", "Order Id", "Invoice No."]
};

function cleanText(text) {
  return (text || "")
    .replace(/\r/g, "\n")
    .replace(/[ \t]+/g, " ")
    .replace(/\n{2,}/g, "\n")
    .trim();
}

function getLines(text) {
  return cleanText(text).split("\n").map(s => s.trim()).filter(Boolean);
}

function findAfterLabel(text, labelRegex, valueRegex) {
  const lines = getLines(text);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const match = line.match(labelRegex);
    if (match && match[1] && match[1].trim()) {
      const inline = match[1].trim().match(valueRegex);
      if (inline) return inline[0];
    }
    if (labelRegex.test(line)) {
      for (let j = i + 1; j <= Math.min(i + 3, lines.length - 1); j++) {
        const candidate = lines[j].match(valueRegex);
        if (candidate) return candidate[0];
      }
    }
  }
  return "";
}

function findMeesho(text) {
  const order = findAfterLabel(
    text,
    /(?:Purchase\s*)?Order\s*No\.?\s*[:#-]?\s*(.*)/i,
    /\d{12,20}/
  );
  const invoice = findAfterLabel(
    text,
    /Invoice\s*No\.?\s*[:#-]?\s*(.*)/i,
    /[A-Z0-9-]{5,}/i
  );

  const total = findAfterLabel(
    text,
    /^\s*Total\s*[:#-]?\s*(.*)/i,
    /(?:₹|Rs\.?\s*)?\d[\d,]*\.\d{2}/i
  );

  return {
    field1: order,
    field2: findMeeshoDescription(text),
    field3: total,
    field4: invoice
  };
}

function findMeeshoDescription(text) {
  const lines = getLines(text);
  const start = lines.findIndex(line => /^Description$/i.test(line));
  if (start < 0) return "";
  const result = [];
  for (let i = start + 1; i < lines.length && result.length < 8; i++) {
    if (/^(HSN|Qty|Gross Amount|Discount|Taxable Value|Taxes|Total)$/i.test(lines[i])) break;
    if (/\b(?:Rs\.?|₹)\s*\d/i.test(lines[i])) break;
    result.push(lines[i]);
  }
  return result.join(" ").trim();
}

function findAmazon(text) {
  const order = findAfterLabel(
    text,
    /Order\s*Number\s*[:#]?\s*(.*)/i,
    /\d{3}-\d{7}-\d{7}/
  );
  const invoice = findAfterLabel(
    text,
    /Invoice\s*Number\s*[:#]?\s*(.*)/i,
    /[A-Z0-9-]{3,}/i
  );

  const lines = getLines(text);
  const descStart = lines.findIndex(line => /^Description$/i.test(line));
  let description = "";
  if (descStart >= 0) {
    for (let i = descStart + 1; i < lines.length && i < descStart + 8; i++) {
      if (/^(HSN|TOTAL:|Amount in Words)/i.test(lines[i])) break;
      description += (description ? " " : "") + lines[i];
    }
  }

  const total = findAfterLabel(
    text,
    /^\s*TOTAL:\s*(.*)/i,
    /(?:₹|Rs\.?\s*)?\d[\d,]*\.\d{2}/i
  );

  return { field1: order, field2: invoice, field3: description, field4: total };
}

function findFlipkart(text) {
  const order = findAfterLabel(
    text,
    /Order\s*Id\s*[:#]?\s*(.*)/i,
    /OD\d{10,}/i
  );
  const invoice = findAfterLabel(
    text,
    /Invoice\s*No\.?\s*[:#]?\s*(.*)/i,
    /[A-Z0-9-]{5,}/i
  );

  const lines = getLines(text);
  let product = "";
  const productStart = lines.findIndex(line => /^Product$/i.test(line));
  if (productStart >= 0) {
    for (let i = productStart + 1; i < lines.length && i < productStart + 8; i++) {
      if (/^(Description|Qty|Gross Amount|Discount|Taxable Value|IGST|CESS|Total)$/i.test(lines[i])) break;
      product += (product ? " " : "") + lines[i];
    }
  }

  const total = findAfterLabel(
    text,
    /TOTAL\s*PRICE\s*[:#]?\s*(.*)/i,
    /(?:₹|Rs\.?\s*)?\d[\d,]*\.\d{2}/i
  );

  return { field1: product, field2: total, field3: order, field4: invoice };
}

function parseInvoice(text, marketplace) {
  if (marketplace === "Meesho") return findMeesho(text);
  if (marketplace === "Amazon") return findAmazon(text);
  return findFlipkart(text);
}

function showFields(data, marketplace) {
  const labels = FIELD_LABELS[marketplace];
  for (let i = 1; i <= 4; i++) {
    $("field" + i + "Label").textContent = labels[i - 1];
    $("field" + i).value = data["field" + i] || "";
  }
  $("review").hidden = false;
}

$("scanBtn").addEventListener("click", async () => {
  const file = $("invoiceFile").files[0];
  if (!file) {
    $("status").textContent = "Please select an invoice image first.";
    return;
  }

  try {
    $("status").textContent = "Scanning invoice... Please wait.";
    const result = await Tesseract.recognize(file, "eng");
    const marketplace = $("marketplace").value;
    const data = parseInvoice(result.data.text, marketplace);
    showFields(data, marketplace);
    $("status").textContent = "OCR completed. Please verify the fields before saving.";
  } catch (err) {
    $("status").textContent = "Scan failed: " + err.message;
  }
});

$("saveBtn").addEventListener("click", () => {
  const marketplace = $("marketplace").value;
  const params = new URLSearchParams({
    action: "saveInvoice",
    marketplace,
    field1: $("field1").value.trim(),
    field2: $("field2").value.trim(),
    field3: $("field3").value.trim(),
    field4: $("field4").value.trim(),
    callback: "invoiceSaveCallback"
  });

  const script = document.createElement("script");
  script.src = APPS_SCRIPT_URL + "?" + params.toString();
  script.onerror = () => {
    $("status").textContent = "Save failed. Check Apps Script deployment and internet connection.";
  };
  document.body.appendChild(script);
});

window.invoiceSaveCallback = function(response) {
  $("status").textContent = response && response.success
    ? "Saved successfully to Google Sheet."
    : "Could not save: " + (response?.message || "Unknown error");
};
</script>
</body>
</html>
