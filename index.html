
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
body{font-family:Arial;max-width:600px;margin:auto;padding:16px;background:#f5f6f8}
.card{background:white;padding:16px;margin-bottom:14px;border-radius:12px}
select,input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;font-size:16px}
button{background:#1a73e8;color:white;border:0;border-radius:8px}
#status{padding:12px;overflow-wrap:anywhere;background:#eee}
</style>
</head>
<body>
<div class="card">
<h2>Parcel Barcode Scanner</h2>
<label>Marketplace</label>
<select id="platform">
<option>Amazon</option><option>Flipkart</option><option>Meesho</option>
</select>
<label>Order ID</label>
<input id="orderId" placeholder="Enter Order ID">
<div id="reader"></div>
<button onclick="startScanner()">Start Camera</button>
<button onclick="stopScanner()">Stop Camera</button>
</div>
<div class="card">
<b>Latest Scan</b>
<p id="raw">Nothing scanned yet.</p>
<div id="status">Ready to scan.</div>
</div>
<script>
const API = "https://script.google.com/macros/s/AKfycbzGasdR-hlOOePT80lu9rZ0sz6xR3dBQ5qOUjwOA7XLlrmOuxDzOXGt8r172_CKaYIYSg/exec";
let scanner = null, busy = false, previous = "";

function status(t){document.getElementById("status").textContent=t;}

function startScanner(){
 if(scanner)return;
 scanner=new Html5Qrcode("reader");
 scanner.start({facingMode:"environment"},
  {fps:10,qrbox:{width:280,height:140}},
  onScan,()=>{}
 ).then(()=>status("Camera ready. Scan barcode."))
 .catch(e=>{scanner=null;status("Camera error: "+e);});
}

async function stopScanner(){
 if(scanner){
  try{await scanner.stop();await scanner.clear();}catch(e){}
  scanner=null;
 }
 status("Scanner stopped.");
}

function onScan(text){
 if(busy||text===previous)return;
 busy=true;previous=text;
 document.getElementById("raw").textContent=text;
 status("Saving to Google Sheet...");

 const params=new URLSearchParams({
  action:"save",
  platform:document.getElementById("platform").value,
  orderId:document.getElementById("orderId").value,
  rawData:text,
  callback:"scanResult"
 });

 window.scanResult=function(r){
  busy=false;
  if(r.ok){status("Saved successfully! Row: "+r.row);}
  else if(r.duplicate){status("Duplicate barcode: not saved.");}
  else{previous="";status("Save failed: "+(r.message||"Unknown error"));}
  delete window.scanResult;
 };

 const s=document.createElement("script");
 s.src=API+"?"+params.toString();
 s.onerror=function(){busy=false;previous="";status("Connection failed. Check deployment access.");s.remove();};
 s.onload=function(){s.remove();};
 document.body.appendChild(s);
}
</script>
</body>
</html>
