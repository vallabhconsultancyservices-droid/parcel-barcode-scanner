
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcel Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial;max-width:600px;margin:auto;padding:15px;background:#f3f5f8}
.card{background:white;padding:15px;border-radius:12px;margin-bottom:14px}
button,input,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;font-size:16px}
button{background:#1769e0;color:white;border:0;border-radius:7px}
#status{padding:12px;background:#eee;overflow-wrap:anywhere}
video{width:100%}
</style>
</head>
<body>
<div class="card">
<h2>Parcel Barcode Scanner</h2>
<label>Marketplace</label>
<select id="platform">
<option>Amazon</option><option>Flipkart</option><option>Meesho</option>
<option>XpressBees</option>
</select>

<h3>1. Scan Barcode / AWB</h3>
<div id="reader"></div>
<button onclick="startScan()">Start Barcode Camera</button>
<button onclick="stopScan()">Stop Camera</button>

<p>Barcode / AWB:</p>
<input id="barcode" placeholder="Barcode will appear here">

<h3>2. Read Order ID from Label</h3>
<p>Parcel label નો ફોટો લો. OCR નંબર વાંચવાનો પ્રયત્ન કરશે.</p>
<input id="photo" type="file" accept="image/*" capture="environment">
<button onclick="readOrder()">Read Order ID (OCR)</button>
<input id="orderId" placeholder="Check/correct Order ID here">

<button onclick="saveParcel()">Save to Google Sheet</button>
<div id="status">Ready.</div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbzGasdR-hlOOePT80lu9rZ0sz6xR3dBQ5qOUjwOA7XLlrmOuxDzOXGt8r172_CKaYIYSg/exec";
let scanner=null, saving=false;

function msg(t){document.getElementById("status").textContent=t;}

async function startScan(){
 if(scanner)return;
 try{
  scanner=new Html5Qrcode("reader");
  await scanner.start({facingMode:"environment"},
   {fps:10,qrbox:{width:280,height:140}},
   async text=>{
    document.getElementById("barcode").value=text;
    msg("Barcode scanned: "+text);
    await stopScan();
   },()=>{});
  msg("Camera ready. Scan barcode.");
 }catch(e){scanner=null;msg("Camera error: "+e);}
}

async function stopScan(){
 if(scanner){
  try{await scanner.stop();await scanner.clear();}catch(e){}
  scanner=null;
 }
}

async function readOrder(){
 const file=document.getElementById("photo").files[0];
 if(!file){msg("Please take a photo of the parcel label first.");return;}
 msg("Reading label... please wait.");
 try{
  const result=await Tesseract.recognize(file,"eng");
  const text=result.data.text;
  // Look for text near Order No / Order ID
  const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  let found="";
  for(let i=0;i<lines.length;i++){
   if(/order\s*(no|id|number)/i.test(lines[i])){
    found=lines[i].replace(/^.*?order\s*(no|id|number)\s*[:.#-]?\s*/i,"").trim();
    if(!found && lines[i+1]) found=lines[i+1].trim();
    if(found)break;
   }
  }
  // Fallback: show OCR text for manual correction
  document.getElementById("orderId").value=found;
  msg(found ? "Order ID detected. Please verify it." :
    "Could not identify Order ID automatically. Check OCR text and enter it manually.");
  if(!found) alert("OCR text:\n"+text+"\n\nOrder ID fieldમાં સાચો નંબર દાખલ કરો.");
 }catch(e){msg("OCR error: "+e.message);}
}

function saveParcel(){
 if(saving)return;
 const barcode=document.getElementById("barcode").value.trim();
 const orderId=document.getElementById("orderId").value.trim();
 if(!barcode){msg("Scan the barcode first.");return;}
 if(!orderId){msg("Order ID missing. Read it with OCR or enter it.");return;}

 saving=true;
 msg("Saving to Google Sheet...");
 const params=new URLSearchParams({
  action:"save",
  platform:document.getElementById("platform").value,
  rawData:barcode,
  orderId:orderId,
  callback:"parcelResult"
 });
 let script=document.createElement("script");
 let finished=false;
 const timer=setTimeout(()=>{
  if(finished)return;finished=true;saving=false;script.remove();
  delete window.parcelResult;msg("No response. Check Apps Script deployment.");
 },20000);

 window.parcelResult=function(r){
  if(finished)return;finished=true;clearTimeout(timer);
  saving=false;script.remove();delete window.parcelResult;
  if(r.ok){
   msg("Saved successfully! Row: "+r.row);
   document.getElementById("barcode").value="";
   document.getElementById("orderId").value="";
   document.getElementById("photo").value="";
  }else msg(r.message || "Save failed.");
 };
 script.onerror=function(){
  if(finished)return;finished=true;clearTimeout(timer);
  saving=false;script.remove();delete window.parcelResult;
  msg("Connection error. Check Apps Script deployment.");
 };
 script.src=API+"?"+params.toString();
 document.body.appendChild(script);
}
</script>
</body>
</html>
